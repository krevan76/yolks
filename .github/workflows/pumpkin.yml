name: build pumpkin
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - master
    paths:
      - pumpkin/**
permissions:
  packages: write

jobs:
  push:
    name: "yolks:pumpkin"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Setup QEMU for ARM64 Build
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug
      - id: lower-repo
        name: Repository to lowercase
        run: |
          echo "repository=${GITHUB_REPOSITORY_OWNER@L}" >> $GITHUB_OUTPUT
      - id: pumpkin
        name: Resolve latest Pumpkin nightly
        run: |
          info=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/Pumpkin-MC/Pumpkin/releases/tags/nightly)
          echo "date=$(echo "$info" | jq -r '.published_at')" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.lower-repo.outputs.repository }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./pumpkin
          file: ./pumpkin/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PUMPKIN_TAG=nightly
            PUMPKIN_VERSION=${{ steps.pumpkin.outputs.date }}
          tags: |
            ghcr.io/${{ steps.lower-repo.outputs.repository }}/yolks:pumpkin
            ghcr.io/${{ steps.lower-repo.outputs.repository }}/yolks:pumpkin_nightly
            ${{ github.repository_owner == 'silly-development' && format('ghcr.io/silly-development/yolks:pumpkin') || '' }}
